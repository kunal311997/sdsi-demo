name: URL Shortener CI

on:
  push:
    branches: [main, kunal-p1]
    paths:
      - 'submissions/kunal-p1/url-shortener/**'
      - '.github/workflows/url-shortener-ci.yml'
  pull_request:
    paths:
      - 'submissions/kunal-p1/url-shortener/**'
      - '.github/workflows/url-shortener-ci.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: submissions/kunal-p1/url-shortener

jobs:
  verify:
    name: typecheck · lint · test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: submissions/kunal-p1/url-shortener/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Tests with coverage
        run: npm run test:cov

      - name: Upload coverage
        if: matrix.node == '22'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: submissions/kunal-p1/url-shortener/coverage
          retention-days: 7

  smoke:
    name: build · boot · HTTP smoke test
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: submissions/kunal-p1/url-shortener/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Boots the compiled server on port 3111, waits for /health, then exercises
      # the M1-M5 contract over real HTTP (34 assertions).
      - name: End-to-end smoke test
        run: npm run test:e2e
